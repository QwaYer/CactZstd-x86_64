# cactsync manifest — see ../.cactsync/README.md
#
# The upstream tree is this repository itself: zstd's sources sit at the root and
# the Cact additions (the Meson build, link.ld, cross/, the sync files) are
# commits on the `cact` branch, stacked on the pinned upstream tag.  Rebasing
# onto a newer tag replays them.

CACT_SYNC_NAME="CactZstd-x86_64"
CACT_SYNC_TREE="."

# `upstream` is meta/zstd; `origin` is reserved for the published fork
# (QwaYer/CactZstd-x86_64) so a push can never reach upstream by accident.
CACT_SYNC_REMOTE="upstream"
CACT_SYNC_URL="https://github.com/meta/zstd.git"

CACT_SYNC_TAG_GLOB="v1.*"
CACT_SYNC_TAG_EXCLUDE=""

CACT_SYNC_REF="v1.5.7"

CACT_SYNC_MODE="rebase"

CACT_SYNC_UNSHALLOW=1

CACT_SYNC_VERIFY="ninja -C build-meson"

CACT_SYNC_NOTES="zstd pinned at v1.5.7; the Cact build files are commits on the cact branch"
